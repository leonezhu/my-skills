<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill Manager</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#c9d1d9;--text2:#8b949e;--accent:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--hover:#1f2937}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:18px;font-weight:600}
.header .stats{color:var(--text2);font-size:13px}
.tabs{display:flex;padding:0 24px;gap:0;border-bottom:1px solid var(--border)}
.tab{padding:10px 16px;font-size:13px;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.tab:hover{color:var(--text);background:var(--hover)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
.content{padding:24px}
.panel{display:none}
.panel.active{display:block}

/* Discover root cards */
.roots-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.root-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px;transition:all .15s;cursor:pointer;position:relative}
.root-card:hover{border-color:var(--accent)}
.root-card.subscribed{border-color:var(--green)}
.root-card.missing{opacity:.5}
.root-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.root-label{font-size:14px;font-weight:600;color:var(--text)}
.root-path{font-size:11px;color:var(--text2);font-family:'SF Mono',monospace;margin-bottom:10px}
.root-count{font-size:12px;color:var(--accent);font-weight:500}
.sub-btn{padding:4px 12px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:12px;cursor:pointer;transition:all .15s}
.sub-btn:hover{border-color:var(--green);color:var(--green)}
.sub-btn.active{background:rgba(63,185,80,.15);border-color:var(--green);color:var(--green)}
.sample-skills{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.sample-tag{font-size:11px;padding:2px 6px;background:var(--bg);border-radius:3px;color:var(--text2)}
.not-exist-badge{font-size:11px;color:var(--yellow);margin-left:8px}

/* Subscribed skills */
.skills-group{margin-bottom:24px}
.skills-group-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.skills-group-header h3{font-size:15px;color:var(--accent)}
.skills-group-header .count{font-size:12px;color:var(--text2)}
.search-bar{margin-bottom:20px;display:flex;gap:8px}
.search-bar input{flex:1;padding:8px 12px;background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;outline:none}
.search-bar input:focus{border-color:var(--accent)}
.search-bar select{padding:8px 12px;background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;outline:none}

.skill-row{display:flex;align-items:center;padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:6px;margin-bottom:6px;transition:all .15s;cursor:pointer}
.skill-row:hover{border-color:var(--accent)}
.skill-row.selected{border-color:var(--accent);background:rgba(88,166,255,.08)}
.skill-name{font-weight:600;font-size:13px;min-width:160px}
.skill-desc{font-size:12px;color:var(--text2);flex:1;margin-left:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.skill-meta{font-size:11px;color:var(--text2);margin-left:12px;white-space:nowrap}
.dup-badge{font-size:10px;padding:1px 6px;background:rgba(210,153,34,.15);color:var(--yellow);border-radius:3px;margin-left:8px}

/* Diff modal */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center}
.modal-overlay.active{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:12px;width:90vw;max-width:900px;max-height:85vh;overflow:hidden;display:flex;flex-direction:column}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.modal-header h3{font-size:14px}
.modal-close{background:none;border:none;color:var(--text2);font-size:20px;cursor:pointer}
.modal-body{flex:1;overflow:auto;padding:16px 20px}
.diff-stats{display:flex;gap:16px;margin-bottom:12px;font-size:12px}
.diff-stats .added{color:var(--green)}
.diff-stats .removed{color:var(--red)}
.diff-content{font-family:'SF Mono',Consolas,monospace;font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-all}
.diff-content .line-add{color:var(--green);background:rgba(63,185,80,.1)}
.diff-content .line-del{color:var(--red);background:rgba(248,81,73,.1)}
.diff-content .line-hdr{color:var(--text2)}

/* Content modal */
.content-modal{font-family:'SF Mono',Consolas,monospace;font-size:12px;line-height:1.8;white-space:pre-wrap}
.action-bar{display:flex;gap:8px;margin-bottom:16px}
.action-btn{padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:12px;cursor:pointer;transition:all .15s}
.action-btn:hover{border-color:var(--accent);color:var(--accent)}
.action-btn.danger:hover{border-color:var(--red);color:var(--red)}
.action-btn:disabled{opacity:.4;cursor:not-allowed}

/* Settings */
.settings-section{margin-bottom:24px}
.settings-section h3{font-size:14px;color:var(--accent);margin-bottom:12px}
.settings-row{display:flex;gap:8px;margin-bottom:8px}
.settings-row input{flex:1;padding:8px 12px;background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;outline:none}
.settings-row input:focus{border-color:var(--accent)}
.settings-row button{padding:8px 16px;border-radius:6px;border:1px solid var(--accent);background:rgba(88,166,255,.1);color:var(--accent);font-size:13px;cursor:pointer}
.extra-root-item{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--card);border:1px solid var(--border);border-radius:6px;margin-bottom:6px;font-size:13px}
.extra-root-item .del-btn{background:none;border:none;color:var(--text2);cursor:pointer;font-size:14px}
.extra-root-item .del-btn:hover{color:var(--red)}
.empty{text-align:center;padding:40px;color:var(--text2);font-size:14px}
</style>
</head>
<body>

<div class="header">
  <h1>⚙️ Skill Manager</h1>
  <span class="stats" id="stats"></span>
</div>

<div class="tabs">
  <div class="tab active" data-tab="discover">🔍 发现</div>
  <div class="tab" data-tab="skills">📦 已订阅</div>
  <div class="tab" data-tab="settings">⚙️ 设置</div>
</div>

<div class="content">
  <!-- Discover panel -->
  <div class="panel active" id="panel-discover">
    <div class="roots-grid" id="roots-grid"></div>
  </div>

  <!-- Skills panel -->
  <div class="panel" id="panel-skills">
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="搜索 skill...">
      <select id="root-filter"><option value="">全部根目录</option></select>
    </div>
    <div class="action-bar">
      <button class="action-btn" id="btn-compare" disabled>🔍 比较选中</button>
      <button class="action-btn" id="btn-view" disabled>📖 查看内容</button>
      <button class="action-btn danger" id="btn-delete" disabled>🗑️ 删除</button>
    </div>
    <div id="skills-list"></div>
  </div>

  <!-- Settings panel -->
  <div class="panel" id="panel-settings">
    <div class="settings-section">
      <h3>➕ 自定义扫描路径</h3>
      <div class="settings-row">
        <input type="text" id="extra-label" placeholder="标签名称（如 My Project）">
        <input type="text" id="extra-path" placeholder="路径（如 ~/projects/my-agent/skills）">
        <button onclick="addExtraRoot()">添加</button>
      </div>
      <div id="extra-roots-list"></div>
    </div>
  </div>
</div>

<!-- Diff modal -->
<div class="modal-overlay" id="diff-modal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="diff-title">比较差异</h3>
      <button class="modal-close" onclick="closeModal('diff-modal')">&times;</button>
    </div>
    <div class="modal-body">
      <div class="diff-stats" id="diff-stats"></div>
      <div class="diff-content" id="diff-content"></div>
    </div>
  </div>
</div>

<!-- Content modal -->
<div class="modal-overlay" id="content-modal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="content-title">Skill 内容</h3>
      <button class="modal-close" onclick="closeModal('content-modal')">&times;</button>
    </div>
    <div class="modal-body">
      <div class="content-modal" id="content-body"></div>
    </div>
  </div>
</div>

<script>
const API = '';
let allSkills = [];
let selectedPaths = new Set();
let currentRoot = '';

// Tabs
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(`panel-${tab.dataset.tab}`).classList.add('active');
    if (tab.dataset.tab === 'skills') loadSkills();
    if (tab.dataset.tab === 'discover') loadDiscover();
    if (tab.dataset.tab === 'settings') loadExtraRoots();
  });
});

// ---- Discover ----
async function loadDiscover() {
  const roots = await fetch(`${API}/api/discover`).then(r => r.json());
  const grid = document.getElementById('roots-grid');
  grid.innerHTML = '';
  const existCount = roots.filter(r => r.exists).length;
  const totalSkills = roots.reduce((s, r) => s + r.skill_count, 0);
  const subCount = roots.filter(r => r.subscribed).length;
  document.getElementById('stats').textContent = `${existCount} 个 Agent · ${totalSkills} Skills · ${subCount} 已订阅`;
  roots.sort((a, b) => b.skill_count - a.skill_count);
  roots.forEach(r => {
    const card = document.createElement('div');
    card.className = `root-card${r.subscribed ? ' subscribed' : ''}${!r.exists ? ' missing' : ''}`;
    card.innerHTML = `
      <div class="root-header">
        <span class="root-label">${r.label}${!r.exists ? '<span class="not-exist-badge">⏳ 未安装</span>' : ''}</span>
        <button class="sub-btn${r.subscribed ? ' active' : ''}" onclick="event.stopPropagation();toggleSub('${r.path}',${!r.subscribed})">
          ${r.subscribed ? '✓ 已订阅' : '+ 订阅'}
        </button>
      </div>
      <div class="root-path">${r.path}</div>
      <div class="root-count">${r.skill_count} skills</div>
      <div class="sample-skills">${r.sample_skills.map(s => `<span class="sample-tag">${s}</span>`).join('')}</div>
    `;
    grid.appendChild(card);
  });
}

async function toggleSub(path, subscribe) {
  if (subscribe) {
    await fetch(`${API}/api/subscriptions?path=${encodeURIComponent(path)}`, {method: 'POST'});
  } else {
    await fetch(`${API}/api/subscriptions?path=${encodeURIComponent(path)}`, {method: 'DELETE'});
  }
  loadDiscover();
}

// ---- Skills ----
async function loadSkills() {
  // Load root filter
  const subs = await fetch(`${API}/api/subscriptions`).then(r => r.json());
  const select = document.getElementById('root-filter');
  const prev = select.value;
  select.innerHTML = '<option value="">全部根目录</option>';
  subs.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.path; opt.textContent = `${s.label} (${s.skills.length})`;
    select.appendChild(opt);
  });
  if (prev) select.value = prev;

  let url = `${API}/api/skills?`;
  const search = document.getElementById('search-input').value;
  const root = document.getElementById('root-filter').value;
  if (search) url += `search=${encodeURIComponent(search)}&`;
  if (root) url += `root=${encodeURIComponent(root)}&`;

  allSkills = [];
  const groups = await fetch(url).then(r => r.json());
  groups.forEach(g => {
    g.instances.forEach(inst => allSkills.push(inst));
  });

  selectedPaths.clear();
  updateActions();
  const list = document.getElementById('skills-list');
  list.innerHTML = '';

  if (groups.length === 0) {
    list.innerHTML = '<div class="empty">暂无订阅的 Skill，去「发现」页面订阅根目录吧</div>';
    return;
  }

  groups.forEach(g => {
    if (g.instances.length > 1) {
      // Group header for duplicates
      const hdr = document.createElement('div');
      hdr.style.cssText = 'font-size:12px;color:#d29922;padding:4px 0;margin-top:8px;';
      hdr.textContent = `⚠️ ${g.name} (出现在 ${g.instances.length} 个位置)`;
      list.appendChild(hdr);
    }
    g.instances.forEach(inst => {
      const row = document.createElement('div');
      row.className = 'skill-row';
      row.dataset.path = inst.skill_dir;
      row.innerHTML = `
        <span class="skill-name">${inst.name}${g.instances.length > 1 ? '<span class="dup-badge">重复</span>' : ''}</span>
        <span class="skill-desc">${inst.description || '—'}</span>
        <span class="skill-meta">${inst.root_dir} · ${inst.file_count} 文件</span>
      `;
      row.addEventListener('click', () => {
        row.classList.toggle('selected');
        if (selectedPaths.has(inst.skill_dir)) selectedPaths.delete(inst.skill_dir);
        else selectedPaths.add(inst.skill_dir);
        updateActions();
      });
      row.addEventListener('dblclick', () => viewContent(inst.skill_dir));
      list.appendChild(row);
    });
  });

  document.getElementById('stats').textContent = `${allSkills.length} skills · ${groups.length} 个名称`;
}

function updateActions() {
  const n = selectedPaths.size;
  document.getElementById('btn-compare').disabled = n !== 2;
  document.getElementById('btn-view').disabled = n !== 1;
  document.getElementById('btn-delete').disabled = n < 1;
}

document.getElementById('btn-compare').addEventListener('click', async () => {
  const [a, b] = [...selectedPaths];
  const data = await fetch(`${API}/api/diff?path_a=${encodeURIComponent(a)}&path_b=${encodeURIComponent(b)}`).then(r => r.json());
  document.getElementById('diff-title').textContent = `${data.skill_a.name} vs ${data.skill_b.name}`;
  document.getElementById('diff-stats').innerHTML = `
    <span>A: ${data.a_lines} 行</span>
    <span>B: ${data.b_lines} 行</span>
    <span class="added">+${data.added}</span>
    <span class="removed">-${data.removed}</span>
    <span>${data.skill_a.root_dir} ↔ ${data.skill_b.root_dir}</span>
  `;
  const el = document.getElementById('diff-content');
  if (!data.unified_diff.trim()) {
    el.innerHTML = '<span style="color:var(--green)">✅ 文件内容完全一致！</span>';
  } else {
    el.innerHTML = data.unified_diff.split('\n').map(line => {
      if (line.startsWith('+++') || line.startsWith('---')) return `<span class="line-hdr">${esc(line)}</span>`;
      if (line.startsWith('+')) return `<span class="line-add">${esc(line)}</span>`;
      if (line.startsWith('-')) return `<span class="line-del">${esc(line)}</span>`;
      return esc(line);
    }).join('\n');
  }
  document.getElementById('diff-modal').classList.add('active');
});

document.getElementById('btn-view').addEventListener('click', () => {
  const path = [...selectedPaths][0];
  viewContent(path);
});

async function viewContent(path) {
  const data = await fetch(`${API}/api/skill-content?path=${encodeURIComponent(path)}`).then(r => r.json());
  document.getElementById('content-title').textContent = data.path;
  document.getElementById('content-body').textContent = data.content;
  document.getElementById('content-modal').classList.add('active');
}

document.getElementById('btn-delete').addEventListener('click', async () => {
  const paths = [...selectedPaths];
  if (!confirm(`确定删除 ${paths.length} 个 skill？\n${paths.map(p => p.split('/').pop()).join(', ')}`)) return;
  for (const p of paths) {
    await fetch(`${API}/api/skills/delete?path=${encodeURIComponent(p)}`, {method: 'DELETE'});
  }
  selectedPaths.clear();
  loadSkills();
});

// Search debounce
let searchTimer;
document.getElementById('search-input').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(loadSkills, 300);
});
document.getElementById('root-filter').addEventListener('change', loadSkills);

// ---- Settings ----
async function loadExtraRoots() {
  const roots = await fetch(`${API}/api/extra-roots`).then(r => r.json());
  const list = document.getElementById('extra-roots-list');
  list.innerHTML = '';
  roots.forEach(r => {
    const item = document.createElement('div');
    item.className = 'extra-root-item';
    item.innerHTML = `
      <span><strong>${r.label}</strong> — ${r.path}</span>
      <button class="del-btn" onclick="delExtraRoot('${r.path}')">&times;</button>
    `;
    list.appendChild(item);
  });
}

async function addExtraRoot() {
  const label = document.getElementById('extra-label').value.trim();
  const path = document.getElementById('extra-path').value.trim();
  if (!label || !path) return;
  await fetch(`${API}/api/extra-roots?label=${encodeURIComponent(label)}&path=${encodeURIComponent(path)}`, {method: 'POST'});
  document.getElementById('extra-label').value = '';
  document.getElementById('extra-path').value = '';
  loadExtraRoots();
}

async function delExtraRoot(path) {
  await fetch(`${API}/api/extra-roots?path=${encodeURIComponent(path)}`, {method: 'DELETE'});
  loadExtraRoots();
}

// Utils
function closeModal(id) { document.getElementById(id).classList.remove('active'); }
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
document.querySelectorAll('.modal-overlay').forEach(m => m.addEventListener('click', e => { if (e.target === m) m.classList.remove('active'); }));

// Init
loadDiscover();
</script>
</body>
</html>
